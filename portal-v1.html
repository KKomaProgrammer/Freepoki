<!doctype html>
<html lang="ko">
<head>

<title>Game Assist Portal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,"Noto Sans KR",sans-serif;color:#202124;background:#fff}button,input,textarea{font:inherit}.hidden{display:none!important}
#app{width:100%;height:100%;position:relative;overflow:hidden;background:#fff}.page{position:absolute;inset:0;overflow:auto}.tools{position:absolute;right:10px;top:10px;z-index:50;display:flex;gap:6px}.tool{width:34px;height:34px;border:1px solid #e2e5e8;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.08);color:#4a4f55}.tool:hover{background:#f4f5f6}.gameimg{width:100%;height:100%;object-fit:cover;background:#eef2f7}.imgph{display:grid;place-items:center;background:linear-gradient(135deg,#eaf0ff,#f6f9ff);color:#5f6368;font-weight:800}
/* Google-like */
.g-home{min-height:100%;background:#fff;display:flex;flex-direction:column}.g-top{height:60px;display:flex;justify-content:flex-end;align-items:center;padding:0 96px 0 22px;gap:17px;font-size:13px}.g-center{display:flex;flex-direction:column;align-items:center;padding-top:70px}.g-logo{font:500 72px/1 Arial;letter-spacing:-5px;margin-bottom:28px}.g-logo span:nth-child(1){color:#4285f4}.g-logo span:nth-child(2){color:#ea4335}.g-logo span:nth-child(3){color:#fbbc05}.g-logo span:nth-child(4){color:#4285f4}.g-search{width:min(584px,calc(100% - 48px));height:46px;border:1px solid #dfe1e5;border-radius:24px;display:flex;align-items:center;padding:0 15px;gap:10px;box-shadow:0 1px 6px rgba(32,33,36,.10)}.g-search input,.g-srp-search input{border:0;outline:0;flex:1;background:transparent;font-size:16px}.g-search button{border:0;background:transparent}.g-buttons{display:flex;gap:10px;margin-top:28px}.g-buttons button{border:1px solid #f8f9fa;background:#f8f9fa;border-radius:4px;padding:10px 16px;color:#3c4043;cursor:pointer}.g-featured{width:min(760px,calc(100% - 52px));margin:52px auto 35px}.g-feature-title{font-size:14px;color:#5f6368;margin-bottom:14px}.g-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g-mini{border:1px solid #e6e8eb;border-radius:12px;overflow:hidden;cursor:pointer}.g-mini-media{aspect-ratio:1.35}.g-mini b{display:block;padding:9px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.g-head{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ebebeb}.g-head-row{height:72px;display:flex;align-items:center;padding:0 96px 0 24px;gap:28px}.g-small{font:bold 28px Arial;letter-spacing:-2px;cursor:pointer}.g-small span:nth-child(1){color:#4285f4}.g-small span:nth-child(2){color:#ea4335}.g-small span:nth-child(3){color:#fbbc05}.g-small span:nth-child(4){color:#4285f4}.g-srp-search{width:min(690px,calc(100% - 150px));height:46px;border:1px solid transparent;border-radius:24px;box-shadow:0 1px 6px rgba(32,33,36,.22);display:flex;align-items:center;padding:0 15px;gap:8px}.g-tabs{height:44px;padding-left:128px;display:flex;align-items:end;gap:24px;font-size:13px;color:#5f6368}.g-tab{padding-bottom:12px;cursor:pointer}.g-tab.active{color:#1a73e8;border-bottom:3px solid #1a73e8}.g-results{width:min(690px,calc(100% - 150px));margin-left:128px;padding:18px 0 40px}.g-about{font-size:12px;color:#70757a;margin-bottom:20px}.g-result{position:relative;padding:5px 118px 27px 0;min-height:112px;cursor:pointer}.g-site{font-size:12px}.g-url{font-size:11px;color:#4d5156;margin:3px 0 5px}.g-title{font-size:20px;color:#1a0dab;line-height:1.3;margin-bottom:5px}.g-result:hover .g-title{text-decoration:underline}.g-snippet{font-size:13px;line-height:1.55;color:#4d5156}.g-thumb{position:absolute;right:0;top:11px;width:92px;height:92px;border-radius:8px;overflow:hidden}.g-game{width:min(900px,calc(100% - 72px));margin:24px auto 45px}.g-game h1{font-size:23px;margin:0 0 14px}
/* Naver-like */
.n-page{min-height:100%;background:#fff}.n-util{height:42px;padding:0 96px 0 28px;display:flex;justify-content:flex-end;align-items:center;gap:14px;color:#666;font-size:12px}.n-head{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px 80px 20px}.n-logo{font:900 38px/1 Arial;color:#03c75a;letter-spacing:-2px;cursor:pointer}.n-search{width:min(640px,calc(100% - 180px));height:54px;border:2px solid #03c75a;border-radius:8px;display:flex;padding-left:18px}.n-search input{border:0;outline:0;flex:1;font-size:18px}.n-search button{width:54px;border:0;background:#03c75a;color:#fff;cursor:pointer}.n-menu{height:52px;border-top:1px solid #eee;border-bottom:1px solid #eee;display:flex;justify-content:center;align-items:center;gap:28px;font-size:14px;font-weight:700}.n-menu span{cursor:pointer}.n-menu .active{color:#03c75a}.n-main{width:min(1120px,calc(100% - 46px));margin:22px auto;display:grid;grid-template-columns:1.55fr .8fr;gap:18px}.n-box{border:1px solid #e3e5e8;border-radius:8px;background:#fff;padding:18px}.n-title{font-size:16px;font-weight:800;margin-bottom:14px}.n-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.n-card{cursor:pointer}.n-card-media{aspect-ratio:1.42;border-radius:8px;overflow:hidden}.n-card b{display:block;font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-side{display:flex;gap:10px;margin-bottom:12px;cursor:pointer}.n-side-media{width:76px;height:56px;border-radius:6px;overflow:hidden;flex:0 0 auto}.n-side b{font-size:13px}.n-side small{display:block;color:#888;margin-top:4px}.n-search-layout{width:min(1050px,calc(100% - 46px));margin:18px auto 40px;display:grid;grid-template-columns:minmax(0,730px) 280px;gap:20px}.n-resultbox{border:1px solid #e5e8eb;border-radius:8px;padding:20px}.n-result{display:grid;grid-template-columns:1fr 112px;gap:18px;padding:18px 0;border-bottom:1px solid #f0f1f3;cursor:pointer}.n-result h3{margin:0 0 8px;font-size:17px}.n-result p{margin:0;color:#666;font-size:13px;line-height:1.55}.n-result-media{width:112px;height:82px;border-radius:7px;overflow:hidden}.n-game{width:min(1050px,calc(100% - 46px));margin:20px auto 40px}.n-playerbox{border:1px solid #e5e8eb;border-radius:8px;padding:18px}.n-playerbox h2{margin:0 0 14px}
/* Chat-like */
.c-page{height:100%;display:grid;grid-template-columns:210px 1fr;background:#fff}.c-side{background:#f7f7f8;border-right:1px solid #ececf1;padding:16px 12px}.c-new{width:100%;border:1px solid #d9d9e3;border-radius:8px;background:#fff;padding:11px 12px;text-align:left;cursor:pointer}.c-side-title{font-size:12px;color:#8e8ea0;margin:22px 9px 8px}.c-side-item{font-size:13px;padding:9px;border-radius:7px;cursor:pointer}.c-side-item:hover{background:#ececf1}.c-main{display:flex;flex-direction:column;min-width:0;position:relative}.c-head{height:54px;border-bottom:1px solid #ececf1;display:flex;align-items:center;padding:0 94px 0 20px;font-weight:700}.c-scroll{flex:1;overflow:auto;padding:28px 24px 110px}.c-welcome{max-width:720px;margin:35px auto 26px;text-align:center}.c-welcome h1{font-size:30px;margin:0 0 8px}.c-welcome p{color:#6e6e80}.c-grid{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.c-card{border:1px solid #e3e3eb;border-radius:12px;overflow:hidden;cursor:pointer}.c-card-media{aspect-ratio:1.35}.c-card b{display:block;padding:10px 11px;font-size:13px}.c-composer{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;width:min(650px,calc(100% - 40px));border:1px solid #d9d9e3;border-radius:14px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;padding:8px 10px}.c-composer input{border:0;outline:0;flex:1;padding:7px}.c-composer button{border:0;border-radius:8px;background:#202123;color:#fff;width:36px;cursor:pointer}.c-game{max-width:920px;margin:auto}.c-game h2{font-size:22px}
/* shared game */
.player{position:relative;width:100%;aspect-ratio:16/9;background:#090909;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.12)}.player iframe{width:100%;height:100%;border:0;background:#000}.player-status{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;background:#111}.player-status button{margin-top:12px;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.game-note{font-size:12px;color:#70757a;margin-top:10px}
/* assistant/settings */
.drawer{position:absolute;right:12px;top:54px;bottom:12px;width:min(360px,calc(100% - 24px));z-index:70;background:#fff;border:1px solid #dfe1e5;border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.22);display:none;flex-direction:column;overflow:hidden}.drawer.open{display:flex}.drawer-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #eceef1;font-weight:700}.drawer-msgs{flex:1;overflow:auto;padding:14px;background:#fafafa}.msg{display:flex;margin:8px 0}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:9px 11px;border-radius:14px;background:#fff;border:1px solid #e4e6e9;font-size:13px;line-height:1.45}.msg.user .bubble{background:#202124;color:#fff}.drawer-compose{border-top:1px solid #eceef1;padding:10px;display:flex;gap:7px}.drawer-compose textarea{flex:1;resize:none;border:1px solid #dfe1e5;border-radius:10px;padding:9px;outline:0;height:42px}.drawer-compose button{width:40px;border:0;border-radius:10px;background:#202124;color:#fff;cursor:pointer}.settings{position:absolute;inset:0;z-index:75;background:#fff;display:none;overflow:auto}.settings.open{display:block}.settings-head{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #e7e9ec;font-weight:800}.settings-head button{width:34px;height:34px;border:0;border-radius:50%;cursor:pointer}.settings-body{max-width:680px;margin:auto;padding:24px}.section{border:1px solid #e1e4e8;border-radius:12px;padding:17px;margin-bottom:14px}.section-title{font-size:13px;font-weight:800;margin-bottom:12px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.theme{border:1px solid #d9dde2;background:#fff;border-radius:10px;padding:12px;cursor:pointer;font-weight:700}.theme.active{border:2px solid #1a73e8;padding:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid #f0f1f3}.row:first-child{border-top:0}.key{border:1px solid #dadde1;background:#fff;border-radius:8px;padding:8px 12px;min-width:76px;cursor:pointer}.textset{width:100%;border:1px solid #dadde1;border-radius:8px;padding:10px}.toggle{width:42px;height:24px;accent-color:#1a73e8}.toast{position:absolute;right:18px;bottom:18px;z-index:90;width:260px;background:#fff;border:1px solid #dfe1e5;border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:13px;display:none}.toast.show{display:block}.toast small{color:#70757a}.toast-line{display:flex;gap:8px;align-items:center;margin-top:7px}.toast code{flex:1;background:#f1f3f4;padding:8px;border-radius:7px;font-weight:700}.toast button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
@media(max-width:720px){.g-mini-grid,.n-grid,.c-grid{grid-template-columns:repeat(2,1fr)}.g-results{margin-left:22px;width:calc(100% - 44px)}.g-tabs{padding-left:22px}.g-head-row{padding-left:16px}.g-small{display:none}.g-srp-search{width:calc(100% - 78px)}.n-main,.n-search-layout{grid-template-columns:1fr}.c-page{grid-template-columns:1fr}.c-side{display:none}}
</style>
</head>
<body>
<div id="app"><main id="page" class="page"></main><div class="tools"><button id="chatTool" class="tool" title="채팅"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5h14v10H9l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></button><button id="settingsTool" class="tool" title="설정"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M7 4v6M17 14v6"/></svg></button><button id="closeTool" class="tool" title="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
<aside id="drawer" class="drawer"><div class="drawer-head"><span>게임 도우미</span><button id="drawerClose" class="tool">×</button></div><div id="msgs" class="drawer-msgs"></div><div class="drawer-compose"><textarea id="composer" placeholder="메시지를 입력하세요"></textarea><button id="send">➤</button></div></aside>
<section id="settings" class="settings"><div class="settings-head"><button id="settingsBack">←</button><span>게임 설정</span></div><div class="settings-body">
<div class="section"><div class="section-title">페이지 스타일</div><div class="themes"><button class="theme" data-theme="google">Google</button><button class="theme" data-theme="naver">Naver</button><button class="theme" data-theme="chat">Chat</button></div></div>
<div class="section"><div class="section-title">화면</div><div class="row"><span>설정 아이콘 표시</span><input id="showSettings" class="toggle" type="checkbox"></div></div>
<div class="section"><div class="section-title">더블 누르기 단축키</div><div class="row"><span>아이콘·박스 숨기기</span><button class="key" data-keyset="hide"></button></div><div class="row"><span>메시지 보내기</span><button class="key" data-keyset="quick"></button></div><div class="row"><span>게임 화면</span><button class="key" data-keyset="game"></button></div></div>
<div class="section"><div class="section-title">단축키 메시지</div><input id="quickMessage" class="textset"></div>
</div></section><div id="toast" class="toast"><small>초기 명령어</small><div class="toast-line"><code>초기 설정</code><button id="copyInit">복사</button></div></div></div>
<script>
(()=>{'use strict';
const CHANNEL='game-assist-portal-v1';const STANDALONE=window.parent===window;const params=new URLSearchParams(location.hash.slice(1));const nonce=params.get('nonce')||'';let parentOrigin='';
const FALLBACK=[['Subway Surfers','subway-surfers'],['Temple Run 2','temple-run-2'],['Stickman Hook','stickman-hook'],['Robo Cleaner Simulator','robo-cleaner-simulator'],['Drive Mad','drive-mad'],['Moto X3M','moto-x3m'],['Monkey Mart','monkey-mart'],['Basketball Stars','basketball-stars'],['Stickman Battle','stickman-battle']].map(([title,slug])=>({title,slug,url:'https://poki.com/kr/g/'+slug,image:''}));
let settings={theme:'chat',showSettingsIcon:true,quickMessage:'게임 설정',shortcuts:{hide:{key:'F8'},quick:{key:'F9'},game:{key:'F10'}},doubleTapMs:360};let games=FALLBACK.slice();let state={view:'home',query:'',game:null,frameUrl:'',error:''};let capture=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function send(type,payload={}){if(!parentOrigin||!nonce)return;parent.postMessage({channel:CHANNEL,nonce,type,payload},parentOrigin)}
window.addEventListener('message',e=>{const m=e.data;if(e.source!==parent||!m||m.channel!==CHANNEL||m.nonce!==nonce)return;if(!parentOrigin){if(m.type!=='INIT')return;parentOrigin=e.origin;}if(e.origin!==parentOrigin)return;onMessage(m.type,m.payload||{})});
function onMessage(type,p){if(type==='INIT'){settings=merge(settings,p.settings);if(Array.isArray(p.games)&&p.games.length)games=p.games;render();sync();if(p.firstRun){$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),9000)}send('REQUEST_CATALOG');return}if(type==='CATALOG'){if(Array.isArray(p.games)&&p.games.length){games=p.games;render()}}if(type==='SETTINGS'){settings=merge(settings,p.settings);render();sync()}if(type==='GAME_RESOLVED'){if(!state.game||p.slug!==state.game.slug)return;state.frameUrl=p.frameUrl||'';state.error=p.error||'';render()}if(type==='RUN_QUICK_MESSAGE'){sendMessage(p.text||settings.quickMessage)}if(type==='OPEN_SETTINGS'){openSettings()}if(type==='PORTAL_RELOAD'){location.reload()}}
function merge(base,input){input=input||{};return{theme:['google','naver','chat'].includes(input.theme)?input.theme:base.theme,showSettingsIcon:typeof input.showSettingsIcon==='boolean'?input.showSettingsIcon:base.showSettingsIcon,quickMessage:typeof input.quickMessage==='string'&&input.quickMessage.trim()?input.quickMessage:base.quickMessage,doubleTapMs:Number(input.doubleTapMs)||base.doubleTapMs,shortcuts:{hide:{key:String(input.shortcuts?.hide?.key||base.shortcuts.hide.key)},quick:{key:String(input.shortcuts?.quick?.key||base.shortcuts.quick.key)},game:{key:String(input.shortcuts?.game?.key||base.shortcuts.game.key)}}}}
function media(g,cls=''){return g.image?`<img class="gameimg ${cls}" src="${esc(g.image)}" alt="" referrerpolicy="no-referrer">`:`<div class="imgph ${cls}">${esc((g.title||'G')[0])}</div>`}
function filtered(){const q=state.query.trim().toLowerCase();return q?games.filter(g=>(g.title+' '+g.slug).toLowerCase().includes(q)):games}
function googleLogo(small=false){return `<div class="${small?'g-small':'g-logo'}" data-home><span>P</span><span>o</span><span>k</span><span>i</span></div>`}
function searchForm(cls){return `<form class="${cls}" data-search-form><span>⌕</span><input name="q" value="${esc(state.query)}" placeholder="Poki 게임 검색" autocomplete="off"><button type="submit" style="display:none"></button></form>`}
function player(){if(!state.game)return'';if(state.error)return `<div class="player"><div class="player-status"><div>게임 화면을 불러오지 못했습니다.<br><button data-open-external="${esc(state.game.url)}">Poki에서 열기</button></div></div></div>`;if(!state.frameUrl)return `<div class="player"><div class="player-status">실제 게임 화면을 찾는 중...</div></div>`;return `<div class="player"><iframe src="${esc(state.frameUrl)}" allow="autoplay; fullscreen; gamepad; camera; microphone; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`}
function renderGoogle(){if(state.view==='home')return `<div class="g-home"><div class="g-top"><span data-q="인기">인기 게임</span><span data-q="2인용">2인용</span></div><div class="g-center">${googleLogo()}${searchForm('g-search')}<div class="g-buttons"><button data-run-search>Google 게임 검색</button><button data-random>오늘의 게임</button></div></div><section class="g-featured"><div class="g-feature-title">Poki 추천 게임</div><div class="g-mini-grid">${games.slice(0,8).map(g=>`<article class="g-mini" data-game="${esc(g.slug)}"><div class="g-mini-media">${media(g)}</div><b>${esc(g.title)}</b></article>`).join('')}</div></section></div>`;const head=`<div class="g-head"><div class="g-head-row">${googleLogo(true)}${searchForm('g-srp-search')}</div><div class="g-tabs"><span class="g-tab active" data-q="">전체</span><span class="g-tab" data-q="action">액션</span><span class="g-tab" data-q="puzzle">퍼즐</span><span class="g-tab" data-q="sport">스포츠</span><span class="g-tab" data-q="racing">레이싱</span></div></div>`;if(state.view==='game')return `${head}<div class="g-game"><div class="g-site">poki.com › kr › g › ${esc(state.game.slug)}</div><h1>${esc(state.game.title)}</h1>${player()}<div class="game-note">게임 데이터와 플레이 트래픽은 Poki에 직접 연결됩니다.</div></div>`;const list=filtered();return `${head}<div class="g-results"><div class="g-about">Poki 게임 검색결과 ${list.length}개</div>${list.map(g=>`<article class="g-result" data-game="${esc(g.slug)}"><div class="g-site">Poki</div><div class="g-url">poki.com › kr › g › ${esc(g.slug)}</div><div class="g-title">${esc(g.title)} - 무료 온라인 게임</div><div class="g-snippet">${esc(g.title)}을(를) Poki에서 무료로 플레이하세요. 설치 없이 바로 즐길 수 있습니다.</div><div class="g-thumb">${media(g)}</div></article>`).join('')}</div>`}
function nHead(){return `<div class="n-util"><span>게임 홈</span><span>즐겨찾기</span></div><div class="n-head"><div class="n-logo" data-home>POKI</div><form class="n-search" data-search-form><input name="q" value="${esc(state.query)}" placeholder="게임을 검색해 주세요"><button>⌕</button></form></div><nav class="n-menu"><span class="active" data-q="">게임</span><span data-q="action">액션</span><span data-q="puzzle">퍼즐</span><span data-q="sport">스포츠</span><span data-q="2">2인용</span></nav>`}
function renderNaver(){const head=nHead();if(state.view==='home')return `<div class="n-page">${head}<div class="n-main"><section class="n-box"><div class="n-title">추천 게임</div><div class="n-grid">${games.slice(0,9).map(g=>`<article class="n-card" data-game="${esc(g.slug)}"><div class="n-card-media">${media(g)}</div><b>${esc(g.title)}</b></article>`).join('')}</div></section><aside class="n-box"><div class="n-title">지금 인기</div>${games.slice(0,5).map((g,i)=>`<div class="n-side" data-game="${esc(g.slug)}"><div class="n-side-media">${media(g)}</div><div><b>${i+1}. ${esc(g.title)}</b><small>Poki 무료 게임</small></div></div>`).join('')}</aside></div></div>`;if(state.view==='game')return `<div class="n-page">${head}<div class="n-game"><div class="n-playerbox"><h2>${esc(state.game.title)}</h2>${player()}</div></div></div>`;const list=filtered();return `<div class="n-page">${head}<div class="n-search-layout"><section class="n-resultbox"><div class="n-title">'${esc(state.query||'게임')}' 검색 결과</div>${list.map(g=>`<article class="n-result" data-game="${esc(g.slug)}"><div><h3>${esc(g.title)}</h3><p>Poki에서 바로 즐길 수 있는 무료 온라인 게임입니다.</p></div><div class="n-result-media">${media(g)}</div></article>`).join('')}</section><aside class="n-box"><div class="n-title">관련 게임</div>${games.slice(0,5).map(g=>`<div class="n-side" data-game="${esc(g.slug)}"><div class="n-side-media">${media(g)}</div><div><b>${esc(g.title)}</b><small>poki.com</small></div></div>`).join('')}</aside></div></div>`}
function renderChat(){const list=filtered().slice(0,12);const main=state.view==='game'?`<div class="c-game"><div class="bubble">${esc(state.game.title)}을 열었어요.</div><h2>${esc(state.game.title)}</h2>${player()}</div>`:`<div class="c-welcome"><h1>오늘 어떤 게임을 할까요?</h1><p>Poki 게임을 검색하거나 추천 게임을 골라보세요.</p></div><div class="c-grid">${list.map(g=>`<article class="c-card" data-game="${esc(g.slug)}"><div class="c-card-media">${media(g)}</div><b>${esc(g.title)}</b></article>`).join('')}</div>`;return `<div class="c-page"><aside class="c-side"><button class="c-new" data-home>＋ 새 게임 찾기</button><div class="c-side-title">빠른 메뉴</div><div class="c-side-item" data-q="action">액션 게임</div><div class="c-side-item" data-q="puzzle">퍼즐 게임</div><div class="c-side-item" data-q="sport">스포츠 게임</div><div class="c-side-item" data-random>랜덤 게임</div></aside><main class="c-main"><div class="c-head">Poki 게임</div><div class="c-scroll">${main}</div><form class="c-composer" data-search-form><input name="q" value="${esc(state.query)}" placeholder="Poki 게임 검색"><button>⌕</button></form></main></div>`}
function render(){document.body.dataset.theme=settings.theme;$('#page').innerHTML=settings.theme==='google'?renderGoogle():settings.theme==='naver'?renderNaver():renderChat();sync()}
function sync(){$('#settingsTool').classList.toggle('hidden',!settings.showSettingsIcon);$$('.theme').forEach(b=>b.classList.toggle('active',b.dataset.theme===settings.theme));$('#showSettings').checked=!!settings.showSettingsIcon;$('#quickMessage').value=settings.quickMessage;$$('.key').forEach(b=>{const k=b.dataset.keyset;b.textContent=capture===k?'키 입력…':settings.shortcuts[k].key})}
function game(slug){return games.find(g=>g.slug===slug)||FALLBACK.find(g=>g.slug===slug)}
function openGame(slug){const g=game(slug);if(!g)return;if(STANDALONE){window.open(g.url,'_blank','noopener');return}state={view:'game',query:state.query,game:g,frameUrl:'',error:''};render();send('OPEN_GAME',{game:g})}
function search(q){state={view:'search',query:String(q||'').trim(),game:null,frameUrl:'',error:''};render()}
function home(){state={view:'home',query:'',game:null,frameUrl:'',error:''};render()}
function openSettings(){$('#settings').classList.add('open');$('#drawer').classList.remove('open');sync()}
function saveSettings(){send('SAVE_SETTINGS',{settings})}
function addMsg(role,text){const x=document.createElement('div');x.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;x.appendChild(b);$('#msgs').appendChild(x);$('#msgs').scrollTop=$('#msgs').scrollHeight}
function parseCommand(text){const v=String(text||'').trim().replace(/\s+/g,'');if(v==='게임설정'||v==='초기설정')return{type:'settings'};if(v==='구글스타일'||v==='구글테마')return{type:'theme',theme:'google'};if(v==='네이버스타일'||v==='네이버테마')return{type:'theme',theme:'naver'};if(v==='채팅스타일'||v==='채팅테마'||v==='챗봇스타일')return{type:'theme',theme:'chat'};if(v==='게임화면'||v==='게임모드')return{type:'game'};return{type:'message'}}
function ruleReply(t){const v=String(t||'').replace(/[\s!?.,~ㅋㅎㅠㅜ]+/g,'').toLowerCase();const has=(...a)=>a.some(x=>v.includes(x));if(has('안녕','하이','반가워'))return'안녕하세요. 어떤 게임을 찾거나 설정을 바꿔드릴까요?';if(has('고마워','감사','땡큐'))return'천만에요. 필요한 게 있으면 편하게 말씀해 주세요.';if(has('누구야','너누구','정체'))return'저는 Poki 게임과 화면 설정을 도와주는 규칙 기반 도우미예요.';if(has('게임추천','추천게임','재밌는게임'))return'액션, 퍼즐, 스포츠 중 원하는 장르를 검색해 보세요.';if(has('기능','뭐할수','도움'))return'게임 설정, 게임 검색, Google·Naver·Chat 스타일 변경, 단축키 설정을 할 수 있어요.';return'그 말은 아직 정확히 이해하지 못했어요. 게임 추천, 게임 설정, 스타일 변경처럼 말씀해 주세요.'}
function sendMessage(text){text=String(text||'').trim();if(!text)return;$('#drawer').classList.add('open');addMsg('user',text);const c=parseCommand(text);if(c.type==='settings'){addMsg('assistant','설정을 열었어요.');openSettings()}else if(c.type==='theme'){settings.theme=c.theme;saveSettings();render();addMsg('assistant',(c.theme==='google'?'Google':c.theme==='naver'?'Naver':'Chat')+' 스타일로 변경했어요.')}else if(c.type==='game'){send('TOGGLE_GAME_FOCUS');addMsg('assistant','게임 화면 모드를 전환했어요.')}else addMsg('assistant',ruleReply(text))}
$('#page').addEventListener('click',e=>{const g=e.target.closest('[data-game]');if(g){openGame(g.dataset.game);return}if(e.target.closest('[data-home]')){home();return}const q=e.target.closest('[data-q]');if(q){search(q.dataset.q);return}if(e.target.closest('[data-random]')){const g=games[Math.floor(Math.random()*games.length)];if(g)openGame(g.slug);return}if(e.target.closest('[data-run-search]')){const i=$('#page').querySelector('[data-search-form] input');search(i?.value||'');return}const ex=e.target.closest('[data-open-external]');if(ex)send('OPEN_EXTERNAL',{url:ex.dataset.openExternal})});
$('#page').addEventListener('submit',e=>{const f=e.target.closest('[data-search-form]');if(!f)return;e.preventDefault();search(new FormData(f).get('q')||'')});
$('#copyInit').onclick=async()=>{try{await navigator.clipboard.writeText('초기 설정')}catch(_){}};$('#chatTool').onclick=()=>{$('#drawer').classList.toggle('open');$('#settings').classList.remove('open')};$('#settingsTool').onclick=openSettings;$('#closeTool').onclick=()=>send('CLOSE_PANEL');$('#drawerClose').onclick=()=>$('#drawer').classList.remove('open');$('#settingsBack').onclick=()=>$('#settings').classList.remove('open');$('#send').onclick=()=>{sendMessage($('#composer').value);$('#composer').value=''};$('#composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}});
$$('.theme').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.theme;saveSettings();render()});$('#showSettings').onchange=e=>{settings.showSettingsIcon=e.target.checked;saveSettings();sync()};$('#quickMessage').onchange=e=>{settings.quickMessage=e.target.value.trim()||'게임 설정';saveSettings()};$$('.key').forEach(b=>b.onclick=()=>{capture=b.dataset.keyset;sync()});window.addEventListener('keydown',e=>{if(!capture)return;e.preventDefault();if(['Shift','Control','Alt','Meta'].includes(e.key))return;settings.shortcuts[capture].key=e.key.length===1?e.key.toUpperCase():e.key;capture=null;saveSettings();sync()},true);
addMsg('assistant','안녕하세요. Poki 게임을 찾거나 설정을 바꿔드릴게요.');render();parent.postMessage({channel:CHANNEL,nonce,type:'PORTAL_READY',payload:{}},'*');
})();
</script>
</body>
</html>
